# The workflows here pin majors (checkout@v7, setup-python@v7,
# actionlint@v2). Majors go unsupported without warning, and the first
# symptom is a workflow that silently stops running — this keeps that
# from going unnoticed.
#
# Weekly, and nothing merges itself — update PRs arrive and only take
# effect once a maintainer reviews and merges them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
